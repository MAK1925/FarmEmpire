<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🌾 Ферма</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/registration.js"></script> <!-- Добавили новый файл для регистрации -->

  <script>
    // Проверяем, есть ли сохранение
    let state = loadGame();
    
    if (!state || !state.registered) {
      // Если игры нет или игрок не зарегистрирован — запускаем регистрацию
      renderRegistration();
    } else {
      // Если уже играет — показываем ферму
      renderMain(state);
    }
  </script>
</body>
</html>
